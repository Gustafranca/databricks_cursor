name: Databricks CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Host is pinned here so auth does not depend on a local ~/.databrickscfg in CI.
  # Repo secret DATABRICKS_SECRET maps to the CLI's DATABRICKS_CLIENT_SECRET (OAuth M2M).
  DATABRICKS_HOST: https://dbc-4a3c13b8-c6c0.cloud.databricks.com
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_SECRET }}
  DATABRICKS_AUTH_TYPE: oauth-m2m
  DATABRICKS_CONFIG_FILE: /dev/null

jobs:
  # Roda em qualquer PR, inclusive de fork: nao toca no Databricks, nao precisa de secret.
  test:
    name: lint + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check .
      - name: pytest (offline)
        env:
          DATABRICKS_SKIP_CONNECT: "1"   # nao abre Databricks Connect so para coletar
        run: uv run pytest -v

  validate:
    name: bundle validate (prod)
    runs-on: ubuntu-latest
    needs: test
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.8.0
        with:
          version: 1.11.0
      - name: Verify CI credentials are present
        run: |
          if [ -z "$DATABRICKS_CLIENT_ID" ] || [ -z "$DATABRICKS_CLIENT_SECRET" ]; then
            echo "Missing DATABRICKS_CLIENT_ID or DATABRICKS_SECRET GitHub Actions secrets."
            exit 1
          fi
      - name: Check service principal auth
        run: databricks current-user me
      - run: databricks bundle validate -t prod

  deploy:
    name: bundle deploy (prod)
    runs-on: ubuntu-latest
    needs: validate
    # Gate humano: o job fica "Waiting for approval" ate o reviewer do environment aprovar.
    # Cria o environment com: gh api --method PUT /repos/<owner>/<repo>/environments/prod
    #   --input - <<< '{"reviewers":[{"type":"User","id":165170684}]}'
    environment: prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Um deploy por vez: todos escrevem o MESMO terraform.tfstate em <root_path>/state.
    # cancel-in-progress FICA false: cancelar no meio do apply deixa o lock preso.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.8.0
        with:
          version: 1.11.0
      - run: databricks bundle deploy -t prod
      - name: O que foi para o workspace
        run: databricks bundle summary -t prod
