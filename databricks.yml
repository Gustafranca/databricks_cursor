# This is a Declarative Automation Bundle definition for databricks_cursor.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_cursor
  uuid: 0cd5a1e8-9f19-4685-a051-9cafb7449729

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  warehouse_id:
    description: The SQL warehouse used by the AI/BI dashboard
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-4a3c13b8-c6c0.cloud.databricks.com
    variables:
      catalog: workspace
  prod:
    mode: production
    workspace:
      host: https://dbc-4a3c13b8-c6c0.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/gustavofrancaa2001@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
    permissions:
      - user_name: gustavofrancaa2001@gmail.com
        level: CAN_MANAGE
      - service_principal_name: 3d1cdf7a-4abd-4c51-a303-6e8068fcd2a7
        level: CAN_MANAGE
