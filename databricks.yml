# This is a Declarative Automation Bundle definition for databricks_cursor.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_cursor
  uuid: 0cd5a1e8-9f19-4685-a051-9cafb7449729

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-4a3c13b8-c6c0.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-4a3c13b8-c6c0.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/gustavofrancaa2001@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/gustavofrancaa2001@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: gustavofrancaa2001@gmail.com
        level: CAN_MANAGE
